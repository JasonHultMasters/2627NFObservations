<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#43276F">
<title>New Faculty Schedules</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plum:#43276F; --plum-deep:#2E1A4F; --plum-soft:#6B4A9E;
  --ink:#2B2039; --ink-2:#5C5170; --ink-3:#786D8B;
  --paper:#fff; --wash:#F5F1F9; --line:#E0D7EC; --line-2:#EFE9F6;
  --gold:#C9A227; --gold-deep:#8A6D12; --gold-soft:#F3E8C4;
  --gutter:62px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:Archivo,system-ui,sans-serif;color:var(--ink);background:var(--wash);
  font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:620px;margin:0 auto;background:var(--paper);min-height:100vh;box-shadow:0 0 0 1px var(--line-2)}

header{position:sticky;top:0;z-index:40;background:var(--plum);color:#fff;
  padding:14px 16px 0;padding-top:calc(14px + env(safe-area-inset-top));
  border-bottom:3px solid var(--gold)}
.hrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.015em}
.clock{font-size:15px;font-weight:500;color:var(--gold-soft)}

.modes{display:inline-flex;gap:2px;background:rgba(255,255,255,.13);border-radius:9px;padding:2px;margin:12px 0 0}
.mode{padding:5px 14px;border-radius:7px;font-size:14px;font-weight:600;color:#D8C9EE}
.mode[aria-pressed=true]{background:var(--gold);color:var(--plum-deep)}

.picker{margin-top:11px;min-height:38px}
.days{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.day{min-width:34px;height:34px;border-radius:9px;font-size:15px;font-weight:600;
  background:rgba(255,255,255,.13);color:#E2D6F2;flex:0 0 auto}
.day[aria-pressed=true]{background:var(--gold);color:var(--plum-deep)}
.day.mark::after{content:"";display:block;width:4px;height:4px;border-radius:50%;
  background:var(--gold);margin:-6px auto 0}
.day.mark[aria-pressed=true]::after{background:var(--plum-deep)}

.datenav{display:flex;align-items:center;gap:8px}
.arrow{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.13);
  font-size:17px;font-weight:600;color:#E2D6F2;line-height:1;flex:0 0 auto}
.arrow[disabled]{opacity:.3;cursor:default}
.datebtn{flex:1;height:34px;border-radius:9px;background:var(--gold);
  font-size:14.5px;font-weight:600;color:var(--plum-deep);padding:0 12px;position:relative;overflow:hidden}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

.sub{font-size:13px;color:#D8C9EE;margin-top:9px}
.freerow{display:flex;align-items:center;gap:10px;margin-top:11px}
.flabel{font-size:13px;color:#D8C9EE;font-weight:500;flex:0 0 auto}
.freeseg{display:inline-flex;gap:2px;background:rgba(255,255,255,.13);border-radius:9px;padding:2px;flex:1}
.fopt{flex:1;padding:5px 8px;border-radius:7px;font-size:13.5px;font-weight:600;color:#D8C9EE}
.fopt[aria-pressed=true]{background:var(--gold);color:var(--plum-deep)}
.sub b{color:var(--gold-soft);font-weight:600}
.people{display:block;text-align:left;margin:11px -16px 0;width:calc(100% + 32px);
  padding:11px 16px;background:rgba(0,0,0,.16);border-top:1px solid rgba(255,255,255,.12);
  font-size:14px;font-weight:600;color:#EDE4F7}
.people span{float:right;color:var(--gold-soft);font-weight:500}

main{padding:0 0 40px}
.slot{display:grid;grid-template-columns:var(--gutter) 1fr;border-bottom:1px solid var(--line-2)}
.time{padding:14px 10px 14px 16px;font-size:14px;font-weight:600;color:var(--ink-2);
  border-right:1px solid var(--line-2);line-height:1.25}
.time em{display:block;font-style:normal;font-size:12px;font-weight:400;color:var(--ink-3);margin-top:1px}
.items{padding:6px 0}
.item{width:100%;text-align:left;display:block;padding:9px 16px 10px}
.item:focus-visible{outline:2px solid var(--plum);outline-offset:-3px}
.who{font-size:16.5px;font-weight:600;letter-spacing:-.01em;color:var(--plum-deep)}
.what{font-size:14.5px;color:var(--ink-2);margin-top:2px}
.where{font-size:13.5px;color:var(--ink-3);margin-top:3px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:1px 6px;border-radius:5px;
  background:var(--gold-soft);color:var(--gold-deep);margin-left:6px;vertical-align:1px}
.nowline{display:grid;grid-template-columns:var(--gutter) 1fr;align-items:center;
  background:linear-gradient(90deg,rgba(201,162,39,.16),transparent 72%)}
.nowline .nt{padding:5px 10px 5px 16px;font-size:12.5px;font-weight:700;color:var(--gold-deep);
  border-right:1px solid var(--line-2)}
.nowline .nb{height:3px;background:var(--gold);margin-right:16px;border-radius:2px}
.panel{padding:2px 16px 14px;background:var(--wash);border-top:1px solid var(--line-2)}
.panel .meta{font-size:13.5px;color:var(--ink-2);margin:10px 0 12px;line-height:1.55}
.slide{background:var(--paper);border:1px solid var(--line);border-radius:12px;
  padding:11px 13px 9px;margin:0 0 12px}
.shead{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.shead b{font-size:16px;font-weight:700;color:var(--plum-deep);letter-spacing:-.01em}
.shead span{font-size:12px;color:var(--ink-3);font-weight:500}
.ticks{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-top:3px}
input.srange{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:none;margin:0}
input.srange::-webkit-slider-runnable-track{height:10px;border-radius:6px;background:var(--wash);
  box-shadow:inset 0 0 0 1px var(--line)}
input.srange::-moz-range-track{height:10px;border-radius:6px;background:var(--wash);
  box-shadow:inset 0 0 0 1px var(--line)}
input.srange::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:30px;height:26px;
  margin-top:-8px;border-radius:8px;background:var(--gold);
  box-shadow:0 1px 3px rgba(46,26,79,.35), inset 0 0 0 1.5px rgba(46,26,79,.25);cursor:grab}
input.srange::-moz-range-thumb{width:30px;height:26px;border:0;border-radius:8px;background:var(--gold);
  box-shadow:0 1px 3px rgba(46,26,79,.35), inset 0 0 0 1.5px rgba(46,26,79,.25);cursor:grab}
input.srange:focus-visible{outline:2px solid var(--plum);outline-offset:3px;border-radius:8px}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel .btn.ghost{padding:10px 12px;font-size:13px;color:var(--ink-3);box-shadow:inset 0 0 0 1.5px var(--line-2)}
.btn{padding:10px 14px;border-radius:10px;font-size:14.5px;font-weight:600;background:var(--plum);color:#fff}
.btn.ghost{background:transparent;color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--line)}
.empty{padding:52px 24px;text-align:center;color:var(--ink-3);font-size:15px}
.empty b{display:block;color:var(--plum-deep);font-size:17px;font-weight:600;margin-bottom:6px}
dialog{border:0;border-radius:16px;padding:0;max-width:min(460px,92vw);width:100%;
  box-shadow:0 24px 60px rgba(46,26,79,.34)}
dialog::backdrop{background:rgba(46,26,79,.55)}
.dlg{padding:20px}
.dlg h2{margin:0 0 14px;font-size:18px;font-weight:700;color:var(--plum-deep)}
.quick{display:flex;gap:6px;margin:0 0 14px}
.qk{flex:1;padding:8px 6px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:var(--plum);box-shadow:inset 0 0 0 1.5px var(--line)}
.qk[aria-pressed=true]{background:var(--plum);color:#fff;box-shadow:none}
.rows{max-height:46vh;overflow:auto;margin:0 -6px}
.wrow{display:flex;align-items:center;gap:11px;padding:10px 6px;width:100%;text-align:left;
  border-bottom:1px solid var(--line-2);font-size:15.5px}
.wrow:last-child{border-bottom:0}
.box{width:21px;height:21px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line);
  flex:0 0 auto;position:relative}
.wrow[aria-pressed=true] .box{background:var(--plum);box-shadow:none}
.wrow[aria-pressed=true] .box::after{content:"";position:absolute;left:7px;top:3px;width:5px;height:10px;
  border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.wsub{color:var(--ink-3);font-size:13px;margin-left:auto}
.dlg .acts{margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
<header>

  <button class="people" id="people"></button>

<main id="rail"></main>
</div>

  <div class="acts">
    <button class="btn" id="whoDone">Show these</button>
    <button class="btn ghost" id="whoAll">Clear all</button>
  </div>
</div></dialog>

  const d=activeDay(), dt=activeDate();
  if(state.mode==='date'){
    sub.innerHTML=(dt===today()?'Today &middot; ':'')+'<b>Day '+d+'</b>';
  }else{
    const t=CAL[today()];
    sub.innerHTML = t===state.day ? 'Today is <b>Day '+state.day+'</b>'
      : dt ? 'Next <b>Day '+state.day+'</b> is '+fmt(dt,1)
           : 'No <b>Day '+state.day+'</b> left this year';
  }
}
function drawFree(){
  [...freeseg.children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.free===state.free));
}
function drawPeople(){
  const n=state.who.length;
  const same=(x,y)=>x.length===y.length&&x.every(v=>y.includes(v));
  let label;
  if(n===0) label='Everyone';
  else if(same(state.who,MINE('Jason'))) label="Jason's six";
  else if(same(state.who,MINE('Arlene'))) label="Arlene's six";
  else label = n===1 ? state.who[0] : n+' people';
  people.innerHTML=label+'<span>'+(n===0?'all '+TEACHERS.length:'change')+'</span>';
}
function tick(){clock.textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}

/* ---------- rail ---------- */
function visible(){
  const pick=showing(), f=state.free;
  let r=M.filter(m=>m.day===activeDay()&&pick.includes(m.teacher)
    &&(f==='all'||(f==='j'?m.j:m.a)));
  return r.sort((a,b)=>mins(a.start)-mins(b.start)||a.teacher.localeCompare(b.teacher));
}
function draw(){
  drawModes();drawPicker();drawSub();drawFree();drawPeople();
  const rows=visible();
  if(!rows.length){
    rail.innerHTML='<div class="empty"><b>Nothing to visit on Day '+activeDay()+'</b>'+
      (state.free!=='all'?(state.free==='j'?'Jason':'Arlene')+' is teaching through all of it. Switch to Anyone to see the rest.'
       :state.who.length?'Not with the people you have selected. Tap the name bar to widen it.':'Try another day.')+'</div>';return;
  }
  const live=isToday(), now=new Date().getHours()*60+new Date().getMinutes();
  const groups={};rows.forEach(m=>{(groups[m.start]=groups[m.start]||[]).push(m)});
  let html='',placed=false;
  for(const s of Object.keys(groups).sort((a,b)=>mins(a)-mins(b))){
    if(live&&!placed&&mins(s)>now){html+='<div class="nowline"><div class="nt">now</div><div class="nb"></div></div>';placed=true}
    html+='<div class="slot"><div class="time">'+pretty(s)+'<em>'+pretty(groups[s][0].end)+'</em></div><div class="items">';
    groups[s].forEach(m=>{
      html+='<button class="item" data-id="'+m.id+'" aria-expanded="'+(state.open===m.id)+'">'+
        '<span class="who">'+m.teacher+'</span>'+
        '<span class="what">'+m.course+(m.sect?' &middot; section '+m.sect:'')+
        (m.block&&m.block!=='-'?'<span class="tag">'+m.block+'</span>':'')+'</span>'+
        '<span class="where">'+m.bldg+(m.room?' '+m.room:'')+'</span></button>';
      if(state.open===m.id){
        const dt=activeDate(), dur=mins(m.end)-mins(m.start), slack=dur-OBS;
        if(offs[m.id]===undefined) offs[m.id]=0;
        const off=Math.min(offs[m.id],Math.max(0,slack));
        html+='<div class="panel"><div class="meta">'+
          'Class runs '+pretty(m.start)+' to '+pretty(m.end)+' &middot; '+
          (m.div==='MS'?'Middle School':'Upper School')+
          (dt?' &middot; next on '+fmt(dt,1):'')+'</div>'+
          '<div class="slide">'+
            '<div class="shead"><b id="sw'+m.id+'">'+window25(m,off)+'</b>'+
              '<span>'+OBS+' minute visit</span></div>'+
            (slack>0
              ? '<input class="srange" type="range" min="0" max="'+slack+'" step="5" value="'+off+
                '" data-slide="'+m.id+'" aria-label="When to arrive">'+
                '<div class="ticks"><span>'+pretty(m.start)+'</span><span>'+pretty(m.end)+'</span></div>'
              : '<div class="ticks"><span>Fills the whole block</span></div>')+
          '</div>'+
          '<div class="acts">'+
          '<button class="btn" data-out="'+m.id+'">Add to Outlook</button>'+
          '<button class="btn ghost" data-ics="'+m.id+'">.ics</button></div></div>';
      }
    });
    html+='</div></div>';
  }
  if(live&&!placed)html+='<div class="nowline"><div class="nt">now</div><div class="nb"></div></div>';
  rail.innerHTML=html;
}

/* ---------- events ---------- */
mDay.onclick =()=>{state.mode='day';LS.set('mode','day');state.open=null;draw()};
mDate.onclick=()=>{state.mode='date';LS.set('mode','date');state.open=null;draw()};
picker.addEventListener('click',e=>{
  const d=e.target.closest('[data-day]');
  if(d){state.day=+d.dataset.day;LS.set('day',state.day);state.open=null;draw();return}
  const i=DATES.indexOf(state.date);
  if(e.target.closest('#prevD')&&i>0){state.date=DATES[i-1];LS.set('date',state.date);state.open=null;draw()}
  if(e.target.closest('#nextD')&&i<DATES.length-1){state.date=DATES[i+1];LS.set('date',state.date);state.open=null;draw()}
});
picker.addEventListener('change',e=>{
  if(e.target.id!=='dateIn')return;
  const v=e.target.value;
  state.date=CAL[v]?v:(DATES.find(k=>k>=v)||DATES[DATES.length-1]);
  LS.set('date',state.date);state.open=null;draw();
});
let draft=[];
function drawWho(){
  whoRows.innerHTML=TEACHERS.map(t=>{
    const n=M.filter(m=>m.teacher===t).length/8;
    return '<button class="wrow" data-t="'+t+'" aria-pressed="'+draft.includes(t)+'">'+
      '<span class="box"></span>'+t+'<span class="wsub">'+ASSIGN[t]+' &middot; '+n+'</span></button>';
  }).join('');
  whoAll.textContent=draft.length?'Clear all':'Select everyone';
  const j=MINE('Jason'), a=MINE('Arlene');
  const same=(x,y)=>x.length===y.length&&x.every(v=>y.includes(v));
  [...quick.children].forEach(b=>b.setAttribute('aria-pressed',
    b.dataset.q==='all' ? draft.length===0||draft.length===TEACHERS.length
    : same(draft, b.dataset.q==='Jason'?j:a)));
}
freeseg.addEventListener('click',e=>{
  const b=e.target.closest('[data-free]');if(!b)return;
  state.free=b.dataset.free;LS.set('free',state.free);state.open=null;draw();
});
people.onclick=()=>{draft=[...state.who];drawWho();dlgWho.showModal()};
whoRows.addEventListener('click',e=>{
  const r=e.target.closest('[data-t]');if(!r)return;
  const t=r.dataset.t;
  draft=draft.includes(t)?draft.filter(x=>x!==t):[...draft,t];
  drawWho();
});
quick.addEventListener('click',e=>{
  const b=e.target.closest('[data-q]');if(!b)return;
  draft = b.dataset.q==='all' ? [...TEACHERS] : MINE(b.dataset.q);
  drawWho();
});
whoAll.onclick=()=>{draft=draft.length?[]:[...TEACHERS];drawWho()};
whoDone.onclick=()=>{
  state.who=(draft.length===TEACHERS.length?[]:draft);
  LS.set('who',state.who);state.open=null;dlgWho.close();draw();
};
rail.addEventListener('input',e=>{
  const r=e.target.closest('[data-slide]');if(!r)return;
  const id=+r.dataset.slide;
  offs[id]=+r.value;
  const lab=document.getElementById('sw'+id);
  if(lab) lab.textContent=window25(M[id],offs[id]);
});
rail.addEventListener('click',e=>{
  const o=e.target.closest('[data-out]');
  if(o){openLink(outlookUrl(+o.dataset.out));return}
  const ics=e.target.closest('[data-ics]');
  if(ics){buildIcs([+ics.dataset.ics]);return}
  const it=e.target.closest('.item');if(!it)return;
  const id=+it.dataset.id;state.open=(state.open===id?null:id);draw();
});

/* ---------- calendar links ---------- */
function evt(id){
  const m=M[id], d=activeDate();
  if(!d) return null;
  const dur=mins(m.end)-mins(m.start);
  const off=Math.min(offs[id]||0, Math.max(0,dur-OBS));
  const [a,b]=slot(m,off);
  const cls=m.course+(m.sect?' '+m.sect:'');
  return {m,d,start:a,end:b,
    title:'Observe '+m.teacher+': '+cls,
    loc:m.bldg+(m.room?' '+m.room:''),
    body:cls+(m.block&&m.block!=='-'?' ('+m.block+' block)':'')+
      ', '+(m.div==='MS'?'Middle School':'Upper School')+
      '. Cycle day '+m.day+'. Class runs '+pretty(m.start)+' to '+pretty(m.end)+'.'};
}
function outlookUrl(id){
  const e=evt(id); if(!e) return null;
  return 'https://outlook.office.com/calendar/0/deeplink/compose?path=/calendar/action/compose'+
    '&subject='+encodeURIComponent(e.title)+
    '&startdt='+e.d+'T'+e.start+':00'+
    '&enddt='+e.d+'T'+e.end+':00'+
    '&location='+encodeURIComponent(e.loc)+
    '&body='+encodeURIComponent(e.body);
}
function openLink(u){
  if(!u){alert('No remaining date on the calendar for Day '+activeDay()+'.');return}
  window.open(u,'_blank','noopener');
}

/* ---------- ICS ---------- */
const pad=n=>String(n).padStart(2,'0');
function stamp(d,t){const[y,mo,dd]=d.split('-').map(Number),[h,mi]=t.split(':').map(Number);
  return ''+y+pad(mo)+pad(dd)+'T'+pad(h)+pad(mi)+'00'}
const esc=s=>String(s).replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
function buildIcs(ids){
  const d=activeDate();
  if(!d){alert('No remaining date on the calendar for Day '+activeDay()+'.');return}
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Masters//New Faculty Schedules//EN','CALSCALE:GREGORIAN'];
  ids.forEach(id=>{const e=evt(id); if(!e) return;
    L.push('BEGIN:VEVENT','UID:nfs-'+id+'-'+d+'@masters',
      'DTSTAMP:'+stamp(today(),'08:00')+'Z',
      'DTSTART;TZID=America/New_York:'+stamp(d,e.start),
      'DTEND;TZID=America/New_York:'+stamp(d,e.end),
      'SUMMARY:'+esc(e.title),
      'LOCATION:'+esc(e.loc),
      'DESCRIPTION:'+esc(e.body),
      'END:VEVENT')});
  L.push('END:VCALENDAR');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([L.join('\r\n')],{type:'text/calendar;charset=utf-8'}));
  a.download=(ids.length>1?'schedules-'+d:'observe-'+M[ids[0]].teacher.split(' ')[1].toLowerCase()+'-'+d)+'.ics';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
tick();setInterval(tick,20000);setInterval(draw,120000);draw();
</script></body></html>
